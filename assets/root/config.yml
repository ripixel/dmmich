# Decap CMS Configuration
# https://decapcms.org/docs/configuration-options/

backend:
  name: github
  repo: ripixel/dmmich
  branch: main
  base_url: https://binghamsundayrunningclub.co.uk
  auth_endpoint: api/auth
  api_root: https://api.github.com
  commit_messages:
    create: 'feat(content): Create {{collection}} "{{slug}}"'
    update: 'feat(content): Update {{collection}} "{{slug}}"'
    delete: 'feat(content): Delete {{collection}} "{{slug}}"'
    uploadMedia: 'feat(media): Upload "{{path}}"'
    deleteMedia: 'feat(media): Delete "{{path}}"'
    openAuthoring: '{{message}}'

media_folder: "assets/images"
public_folder: "/images"

site_url: https://dmmichthecoach.co.uk
display_url: https://dmmichthecoach.co.uk

slug:
  encoding: "ascii"
  clean_accents: true

collections:

  # ── Global Settings ──
  - name: "settings"
    label: "Settings"
    files:
      - name: "site"
        label: "Site Settings"
        file: "content/settings/site.json"
        fields:
          - { label: "Site Name", name: "name", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Email Address", name: "email", widget: "string" }
          - { label: "Phone Number", name: "phone", widget: "string" }
          - { label: "Instagram URL", name: "instagram_url", widget: "string" }
          - { label: "Instagram Handle", name: "instagram_handle", widget: "string" }
          - { label: "Run Club Instagram URL", name: "run_club_instagram_url", widget: "string" }
          - { label: "Run Club Instagram Handle", name: "run_club_instagram_handle", widget: "string" }
          - { label: "Masthead booking text (e.g. NOW BOOKING 2026)", name: "masthead_booking_text", widget: "string" }
          - { label: "Qualification", name: "qualification", widget: "string" }
          - { label: "Specialty", name: "specialty", widget: "string" }
          - { label: "Location Base", name: "location_base", widget: "string" }
          - label: "IronHQ Location"
            name: "locations"
            widget: "list"
            min: 1
            max: 1
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Address", name: "address", widget: "string" }
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Image Alt Text", name: "image_alt", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Google Maps Embed URL", name: "map_embed", widget: "string" }

  # ── Homepage Content ──
  - name: "pages"
    label: "Pages"
    files:

      - name: "home"
        label: "Homepage"
        file: "content/pages/home.json"
        fields:

          # Hero
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Eyebrow text", name: "eyebrow", widget: "string" }
              - { label: "Background image (fallback / poster)", name: "background_image", widget: "image" }
              - { label: "Background video (MP4, optional — replaces image)", name: "background_video", widget: "file", required: false, allow_multiple: false }
              - { label: "Blurb (under headline)", name: "blurb", widget: "text" }
              - { label: "Bootcamp stat (e.g. THU 5:30)", name: "stat_bootcamp", widget: "string" }
              - { label: "Run Club stat (e.g. SUN 9:00)", name: "stat_runclub", widget: "string" }
              - { label: "Client count stat (e.g. 60+)", name: "stat_clients", widget: "string" }

          # Services
          - label: "Services"
            name: "services"
            widget: "object"
            fields:
              - label: "Personal Training"
                name: "pt"
                widget: "object"
                fields:
                  - { label: "Description", name: "description", widget: "text" }
                  - { label: "Features", name: "features", widget: "list", field: { label: "Feature", name: "feature", widget: "string" } }
                  - { label: "Price tag (e.g. FROM £30 / SESSION)", name: "price", widget: "string" }
                  - { label: "CTA button text", name: "cta", widget: "string" }
              - { label: "Card photo", name: "image", widget: "image" }
              - { label: "Card photo alt text", name: "image_alt", widget: "string" }
              - label: "Bootcamp"
                name: "bootcamp"
                widget: "object"
                fields:
                  - { label: "Description", name: "description", widget: "text" }
                  - { label: "Price tag", name: "price", widget: "string" }
              - label: "Sunday Run Club"
                name: "run_club"
                widget: "object"
                fields:
                  - { label: "Description", name: "description", widget: "text" }
                  - { label: "Price tag", name: "price", widget: "string" }

          # About
          - label: "About Dean"
            name: "about"
            widget: "object"
            fields:
              - { label: "Portrait photo", name: "portrait", widget: "image" }
              - { label: "Portrait alt text", name: "portrait_alt", widget: "string" }
              - { label: "Bio paragraph 1 (HTML OK for bold)", name: "bio_1", widget: "text" }
              - { label: "Bio paragraph 2", name: "bio_2", widget: "text" }
              - { label: "Bio paragraph 3", name: "bio_3", widget: "text" }
              - label: "Qualifications"
                name: "qualifications"
                widget: "list"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Year / Note", name: "year", widget: "string" }
              - label: "Competing"
                name: "competing"
                widget: "list"
                fields:
                  - { label: "Event", name: "label", widget: "string" }
                  - { label: "Result / Year", name: "year", widget: "string" }

          # IronHQ
          - label: "IronHQ Section"
            name: "ironhq"
            widget: "object"
            fields:
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Facilities list", name: "facilities", widget: "list", field: { label: "Item", name: "item", widget: "string" } }

          # Run Club
          - label: "Sunday Run Club Section"
            name: "run_club"
            widget: "object"
            fields:
              - { label: "Section photo", name: "image", widget: "image" }
              - { label: "Section photo alt text", name: "image_alt", widget: "string" }
              - { label: "Body paragraph 1", name: "body_1", widget: "text" }
              - { label: "Body paragraph 2", name: "body_2", widget: "text" }
              - { label: "Regulars count (e.g. 40+)", name: "regulars", widget: "string" }

          # Bootcamp
          - label: "Bootcamp Section"
            name: "bootcamp"
            widget: "object"
            fields:
              - { label: "Section photo (optional)", name: "image", widget: "image", required: false }
              - { label: "Section photo alt text", name: "image_alt", widget: "string" }
              - { label: "Body paragraph 1", name: "body_1", widget: "text" }
              - { label: "Body paragraph 2", name: "body_2", widget: "text" }

          # Prices
          - label: "Prices"
            name: "prices"
            widget: "object"
            fields:
              - label: "Personal Training price"
                name: "pt"
                widget: "object"
                fields:
                  - { label: "Price figure (e.g. £30)", name: "price", widget: "string" }
                  - { label: "Features", name: "features", widget: "list", field: { label: "Feature", name: "feature", widget: "string" } }
              - label: "Bootcamp price"
                name: "bootcamp"
                widget: "object"
                fields:
                  - { label: "Price figure (e.g. £10)", name: "price", widget: "string" }
                  - { label: "Features", name: "features", widget: "list", field: { label: "Feature", name: "feature", widget: "string" } }
              - label: "Run Club price"
                name: "run_club"
                widget: "object"
                fields:
                  - { label: "Features", name: "features", widget: "list", field: { label: "Feature", name: "feature", widget: "string" } }

          # Gallery
          - label: "Gallery"
            name: "gallery"
            widget: "object"
            fields:
              - label: "Images"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Image", name: "src", widget: "image" }
                  - { label: "Alt text", name: "alt", widget: "string" }
                  - { label: "Meta label (e.g. Thu · bootcamp)", name: "meta", widget: "string" }

          # Testimonials
          - label: "Testimonials"
            name: "testimonials"
            widget: "object"
            fields:
              - label: "Items"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Stars (e.g. ★ ★ ★ ★ ★)", name: "stars", widget: "string" }
                  - { label: "Quote", name: "quote", widget: "text" }
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Duration / result", name: "duration", widget: "string" }
                  - { label: "Before image", name: "before_image", widget: "image", required: false }
                  - { label: "After image", name: "after_image", widget: "image", required: false }
                  - { label: "Second after image (optional — replaces before/after with two after photos)", name: "after_image_2", widget: "image", required: false }

          # FAQ
          - label: "FAQ"
            name: "faq"
            widget: "object"
            fields:
              - label: "Items"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Question", name: "question", widget: "string" }
                  - { label: "Answer", name: "answer", widget: "text" }

          # Contact
          - label: "Contact section"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Blurb text", name: "blurb", widget: "text" }
